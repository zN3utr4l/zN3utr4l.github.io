name: Prezzi carburanti

# Verifica il parser senza contattare MIMIT. La rigenerazione giornaliera e
# il push con deploy key sono gestiti dalla CI privata di Carburo, su un
# runner che raggiunge MIMIT; i runner GitHub-hosted non rigenerano la pagina.
on:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/prezzi.yml']
  pull_request:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/prezzi.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Il parser e' il pezzo rischioso: se il formato del CSV cambia deve
      # rifiutarsi di scrivere, non pubblicare una pagina vuota.
      - name: Test del parser
        run: node --test scripts/build-prezzi.test.mjs
