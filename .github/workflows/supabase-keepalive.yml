name: Supabase keep-alive

# Il free tier di Supabase mette in pausa un progetto dopo ~7 giorni di totale
# inattività. Un ping ogni 3 giorni tiene svegli i DB di PumpLog e Carburo.
# Vive qui e non nei repo delle app: questo repo è pubblico, quindi i runner
# GitHub-hosted sono gratuiti; sui repo privati il job era bloccato dal billing.

on:
  schedule:
    - cron: '0 6 */3 * *'   # ogni 3 giorni alle 06:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        app: [PUMPLOG, CARBURO]
    defaults:
      run:
        shell: bash
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets[format('{0}_SUPABASE_URL', matrix.app)] }}
          SUPABASE_KEY: ${{ secrets[format('{0}_SUPABASE_PUBLISHABLE_KEY', matrix.app)] }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Secret ${{ matrix.app }}_SUPABASE_URL / ${{ matrix.app }}_SUPABASE_PUBLISHABLE_KEY mancanti"; exit 1
          fi
          code=$(curl -sS --max-time 30 -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/" -H "apikey: $SUPABASE_KEY") || code=000
          echo "Supabase REST responded: $code"
          # Qualsiasi risposta HTTP conta come attività; fallisce solo se irraggiungibile.
          case "$code" in
            2*|3*|4*) exit 0 ;;
            *) echo "Endpoint irraggiungibile"; exit 1 ;;
          esac
